# Scrapes the collector's Prometheus exporter, which re-exposes the metrics
# the API pushes over OTLP.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Keep job=<service.name> and instance=<service.instance.id> as set by
    # the exporter instead of renaming them to exported_job/exported_instance.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
