components:
  schemas:
    CreateInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/api/v1/schemas/CreateInputBody.json
          format: uri
          readOnly: true
          type: string
        alias:
          description: Optional custom code
          maxLength: 32
          minLength: 3
          pattern: ^[A-Za-z0-9_-]+$
          type: string
        expires_at:
          description: Optional expiry, RFC 3339
          format: date-time
          type: string
        url:
          description: Absolute http or https URL to redirect to
          examples:
            - https://example.com/some/long/path
          format: uri
          maxLength: 2048
          type: string
      required:
        - url
      type: object
    DayBody:
      additionalProperties: false
      properties:
        clicks:
          description: Redirects served that day
          format: int64
          type: integer
        date:
          description: UTC calendar day
          examples:
            - "2026-11-02"
          format: date
          type: string
      required:
        - date
        - clicks
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/api/v1/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LinkBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/api/v1/schemas/LinkBody.json
          format: uri
          readOnly: true
          type: string
        click_count:
          description: Redirects served so far
          format: int64
          type: integer
        code:
          description: Short code
          examples:
            - aZ3kQ9x
          type: string
        created_at:
          format: date-time
          type: string
        expires_at:
          description: When the link stops redirecting
          format: date-time
          type: string
        short_url:
          description: Public redirect URL
          format: uri
          type: string
        url:
          description: Target URL
          format: uri
          type: string
      required:
        - code
        - short_url
        - url
        - click_count
        - created_at
      type: object
    LinkStats:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/api/v1/schemas/LinkStats.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Short code
          examples:
            - aZ3kQ9x
          type: string
        days:
          description: Last 7 UTC days, oldest first, zero-filled
          items:
            $ref: "#/components/schemas/DayBody"
          type:
            - array
            - "null"
        total_clicks:
          description: Lifetime redirects, including days outside the window
          format: int64
          type: integer
      required:
        - code
        - total_clicks
        - days
      type: object
    ListOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - http://localhost:8080/api/v1/schemas/ListOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/LinkBody"
          type:
            - array
            - "null"
        next_cursor:
          description: Pass as cursor to fetch the next page; absent on the last page
          type: string
      required:
        - items
      type: object
  securitySchemes:
    bearerAuth:
      description: API key issued with `task apikey:create -- <name>`.
      scheme: bearer
      type: http
info:
  description: Create short links and track redirects.
  title: URL Shortener API
  version: 1.0.0
openapi: 3.1.0
paths:
  /links:
    get:
      operationId: list-links
      parameters:
        - description: Opaque cursor from a previous page
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous page
            type: string
        - description: Page size, default 20
          explode: false
          in: query
          name: limit
          schema:
            description: Page size, default 20
            format: int32
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: List the caller's links, newest first
      tags:
        - links
    post:
      operationId: create-link
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkBody"
          description: Created
          headers:
            Location:
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Create a short link
      tags:
        - links
  /links/{code}:
    delete:
      operationId: delete-link
      parameters:
        - in: path
          name: code
          required: true
          schema:
            maxLength: 32
            minLength: 3
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Delete a link. Its short URL stops redirecting.
      tags:
        - links
    get:
      operationId: get-link
      parameters:
        - in: path
          name: code
          required: true
          schema:
            maxLength: 32
            minLength: 3
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Get a link and its click count
      tags:
        - links
  /links/{code}/stats:
    get:
      description: Lifetime total plus clicks per UTC day for the last 7 days. Counts are flushed in batches, so the latest second may be missing.
      operationId: get-link-stats
      parameters:
        - in: path
          name: code
          required: true
          schema:
            maxLength: 32
            minLength: 3
            pattern: ^[A-Za-z0-9_-]+$
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkStats"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      summary: Click statistics for a link
      tags:
        - links
security:
  - bearerAuth: []
servers:
  - url: http://localhost:8080/api/v1
