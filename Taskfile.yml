version: '3'

dotenv: ['.env']

vars:
  BIN: bin/api
  PKG: ./cmd/api
  COMPOSE: docker compose -f deploy/docker-compose.yml
  # Reported as service.version in telemetry.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task --list
    silent: true

  run:
    desc: Run the API locally
    cmds:
      - go run {{.PKG}}

  build:
    desc: Build the API binary
    sources: ['**/*.go', go.mod, go.sum]
    generates: ['{{.BIN}}']
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version={{.VERSION}}" -o {{.BIN}} {{.PKG}}

  test:
    desc: Run unit tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (needs Docker)
    cmds:
      - go test -race -count=1 -tags=integration ./test/integration/...

  test:all:
    desc: Run unit and integration tests
    cmds:
      - task: test
      - task: test:integration

  ci:
    desc: Everything CI runs, locally
    cmds:
      - task: lint
      - task: sqlc:check
      - task: test:all
      - task: image:build

  image:build:
    desc: Build the container image
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} -t shortener:local .

  image:run:
    desc: Run the image against the compose Postgres on port 8080
    cmds:
      # PORT is forced after --env-file so the published port always matches.
      # --add-host makes host.docker.internal resolve on Linux Docker too.
      - >-
        docker run --rm -p 8080:8080 --env-file .env
        --add-host=host.docker.internal:host-gateway
        -e PORT=8080
        -e DATABASE_URL=postgres://shortener:shortener@host.docker.internal:${POSTGRES_HOST_PORT:-5434}/shortener?sslmode=disable
        shortener:local

  lint:
    desc: Run go vet and golangci-lint
    cmds:
      - go vet -tags=integration ./...
      - golangci-lint run ./...

  fmt:
    desc: Format and fix lint issues where possible
    cmds:
      - golangci-lint fmt ./...
      - golangci-lint run --fix ./...

  tidy:
    desc: Tidy go.mod and go.sum
    cmds:
      - go mod tidy

  up:
    desc: Start local Postgres
    cmds:
      - '{{.COMPOSE}} up -d --wait'

  down:
    desc: Stop everything in the compose project (Postgres and the observability stack) and remove volumes
    cmds:
      - '{{.COMPOSE}} --profile observability down -v'

  otel:up:
    desc: "Start Postgres plus the OTel collector, Jaeger (http://localhost:16686) and Prometheus (http://localhost:9090). Set TELEMETRY_ENABLED=true in .env to export."
    cmds:
      - '{{.COMPOSE}} --profile observability up -d --wait'

  otel:down:
    desc: Stop the observability stack, leaving Postgres running
    cmds:
      - '{{.COMPOSE}} --profile observability rm --stop --force otel-collector jaeger prometheus'

  apikey:create:
    desc: "Issue an API key and print it once. Usage: task apikey:create -- <name>"
    cmds:
      - go run {{.PKG}} apikey create {{.CLI_ARGS}}

  clicks:purge:
    desc: Delete clicks older than CLICK_RETENTION (for cron when CLICK_PURGE_INTERVAL=0)
    cmds:
      - go run {{.PKG}} clicks purge

  migrate:
    desc: Apply pending migrations (phase 1)
    cmds:
      - goose -dir migrations postgres "$DATABASE_URL" up

  migrate:status:
    desc: Show migration status
    cmds:
      - goose -dir migrations postgres "$DATABASE_URL" status

  sqlc:
    desc: Regenerate sqlc code (phase 1)
    cmds:
      - sqlc generate

  sqlc:check:
    desc: Fail if generated sqlc code is stale
    cmds:
      - sqlc diff
